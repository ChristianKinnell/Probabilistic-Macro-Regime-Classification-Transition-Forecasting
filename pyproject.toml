[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-regime-engine"
version = "0.1.0"
description = "Point-in-time two-axis macro regime classification and transition forecasting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.2",
  "scikit-learn==1.7.2",
  "hmmlearn==0.3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["macro_regime*"]
